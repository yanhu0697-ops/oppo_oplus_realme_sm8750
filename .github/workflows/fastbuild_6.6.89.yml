name: 6.6.89 欧加真OKI内核快速构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '89'
  KERNEL_NAME: 'android15-8-g7e1f3c083cc6-abogki467167594-4k'
  CCACHE_KEY: ccache-ecsv4-6.6.89

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支类型选择 (默认sukisu)'
        required: true
        type: choice
        default: 'sukisu'
        options:
          - 'sukisu'
          - 'bakasu'
          - 'ksunext'
          - 'ksu'
          - 'none'

      sukisu_version:
        description: 'SukiSU Ultra 驱动版本选择 (仅当选择 sukisu 时生效; 推荐 v4.1.3 或 HEAD)'
        required: false
        type: choice
        default: 'default (最新 HEAD)'
        options:
          - 'default (最新 HEAD)'
          - 'v4.2.0'
          - 'v4.1.3'
          - 'v4.1.2'
          - 'v4.1.1'
          - 'v4.1.0'
          - 'v4.0.0'
          - 'v3.2.0'
          - 'custom (手动在下方自定义框输入)'

      bakasu_version:
        description: 'BakaSU 驱动版本选择 (仅当选择 bakasu 时生效; 默认锁定 35187/4; 最新HEAD已合入PR#3877)'
        required: false
        type: choice
        default: '94dd3c93 (v35187/4 稳定且全绿)'
        options:
          - 'default (最新 HEAD, v35226+)'
          - '94dd3c93 (v35187/4 稳定且全绿)'
          - 'fa12ffd (合入PR#3877耗时修复)'
          - '48fa4bb (susfs暂挂前最后一个版本)'
          - '5b76b88 (v35207)'
          - '8450dd2 (v35198)'
          - 'custom (手动在下方自定义框输入)'

      ksunext_version:
        description: 'KernelSU Next 驱动版本选择 (仅当选择 ksunext 时生效)'
        required: false
        type: choice
        default: 'dev-susfs (推荐 dev-susfs 分支)'
        options:
          - 'dev-susfs (推荐 dev-susfs 分支)'
          - 'v3.4.1'
          - 'v3.4.0'
          - 'v3.3.0'
          - 'v3.2.0'
          - 'v3.1.0'
          - 'custom (手动在下方自定义框输入)'

      ksu_version:
        description: '原版 KernelSU 驱动版本选择 (仅当选择 ksu 时生效)'
        required: false
        type: choice
        default: 'default (最新 main 分支)'
        options:
          - 'default (最新 main 分支)'
          - 'v3.3.1 (已合入PR#3877耗时修复)'
          - 'v3.3.0'
          - 'v3.2.5'
          - 'v3.2.4'
          - 'v3.2.3'
          - 'v3.2.2'
          - 'custom (手动在下方自定义框输入)'

      custom_driver_ref:
        description: '自定义驱动 Commit SHA 或 Tag (各版本下拉选 custom 时在此输入; 留空则忽略)'
        required: false
        type: string
        default: ''

      enable_timing_patch:
        description: '【开关】是否注入系统调用耗时侧信道修复补丁 (消除 newfstatat/statx 时间比值检测; 若上游已合入可关闭)'
        required: true
        type: boolean
        default: 'true'

      dirtyfrag_fix:
        description: '【安全加固】是否修补 DirtyFrag (CVE-2026-43284) 本地提权与 SELinux 篡改漏洞'
        required: true
        type: boolean
        default: 'true'

      bypass_susfs_check:
        description: '【开关】是否自动放行 susfs_compat.mk 阻断检查 (若驱动版本更新而 susfs 未适配, 开启防编译报错)'
        required: true
        type: boolean
        default: 'true'

      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-Clang18工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev ccache &
          
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_v_16.0.0_oneplus_13_6.6.89.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_kernel_common_oneplus_sm8750-oneplus-sm8750_v_16.0.0_oneplus_13_6.6.89" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-clang18工具链..." &&
          mkdir -p clang18 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &&
          unzip -q clang.zip -d clang18 &&
          rm -rf clang.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "所有源码及llvm-Clang18工具链初始化完成！"
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi
      
      - name: 初始化并配置ccache
        run: |
          # 设置ccache环境变量
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 确保ccache目录存在
          mkdir -p "$CCACHE_DIR"
          
          # 每次运行都重新配置缓存大小
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 显示初始缓存状态
          echo "ccache初始状态:"
          ccache -s
          
          # 如果缓存恢复命中，显示详细信息
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        run: |
          # 进入内核工作目录
          cd kernel_workspace
          
          # 解析用户选择的驱动版本目标
          KSU_TARGET_REF=""
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            RAW_SEL="${{ github.event.inputs.sukisu_version }}"
            if [[ "$RAW_SEL" == custom* ]]; then
              KSU_TARGET_REF="${{ github.event.inputs.custom_driver_ref }}"
            elif [[ "$RAW_SEL" == default* ]]; then
              KSU_TARGET_REF=""
            else
              KSU_TARGET_REF=$(echo "$RAW_SEL" | awk '{print $1}')
            fi
          elif [[ "${{ github.event.inputs.ksu_type }}" == "bakasu" ]]; then
            RAW_SEL="${{ github.event.inputs.bakasu_version }}"
            if [[ "$RAW_SEL" == custom* ]]; then
              KSU_TARGET_REF="${{ github.event.inputs.custom_driver_ref }}"
            elif [[ "$RAW_SEL" == default* ]]; then
              KSU_TARGET_REF=""
            else
              KSU_TARGET_REF=$(echo "$RAW_SEL" | awk '{print $1}')
            fi
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            RAW_SEL="${{ github.event.inputs.ksunext_version }}"
            if [[ "$RAW_SEL" == custom* ]]; then
              KSU_TARGET_REF="${{ github.event.inputs.custom_driver_ref }}"
            elif [[ "$RAW_SEL" == dev-susfs* ]]; then
              KSU_TARGET_REF="dev-susfs"
            else
              KSU_TARGET_REF=$(echo "$RAW_SEL" | awk '{print $1}')
            fi
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            RAW_SEL="${{ github.event.inputs.ksu_version }}"
            if [[ "$RAW_SEL" == custom* ]]; then
              KSU_TARGET_REF="${{ github.event.inputs.custom_driver_ref }}"
            elif [[ "$RAW_SEL" == default* ]]; then
              KSU_TARGET_REF=""
            else
              KSU_TARGET_REF=$(echo "$RAW_SEL" | awk '{print $1}')
            fi
          fi
          
          echo "KSU类型: ${{ github.event.inputs.ksu_type }}"
          echo "目标驱动 Ref: [${KSU_TARGET_REF}]"
          echo "TARGET_DRIVER_REF=${KSU_TARGET_REF}" >> $GITHUB_ENV
          
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            echo "正在配置真正的正统 SukiSU-Ultra 源码树 (ShirkNeko/SukiSU-Ultra)..."
            curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            if [[ -n "$KSU_TARGET_REF" ]]; then
              echo ">>> 正在检出指定的 SukiSU-Ultra 驱动版本/Commit: $KSU_TARGET_REF"
              git checkout "$KSU_TARGET_REF" || true
            fi
            
            # 自动化动态解析：优先从源码树自身提取官方定义的 Version Code
            DYNAMIC_CODE=""
            if [ -f "manager/app/build.gradle.kts" ]; then
              DYNAMIC_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' manager/app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+' || true)
            fi
            if [ -z "$DYNAMIC_CODE" ] && [ -f "userspace/ksud/Cargo.toml" ]; then
              DYNAMIC_CODE=$(grep -E '^version\s*=\s*' userspace/ksud/Cargo.toml | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | awk -F. '{printf("%d%02d%02d", $1, $2, $3)}' || true)
            fi
            
            # 若自动检测失败则依据语义化 Tag 兜底，绝不使用死值
            if [ -n "$DYNAMIC_CODE" ]; then
              KSU_VERSION="$DYNAMIC_CODE"
            else
              SEM_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v4.2.0")
              CLEAN_SEM=$(echo "$SEM_TAG" | sed 's/^v//')
              MAJOR=$(echo "$CLEAN_SEM" | cut -d. -f1)
              MINOR=$(echo "$CLEAN_SEM" | cut -d. -f2)
              PATCH=$(echo "$CLEAN_SEM" | cut -d. -f3 | cut -d- -f1)
              KSU_VERSION=$(awk "BEGIN {printf \"%d%02d%02d\", $MAJOR, $MINOR, $PATCH}")
            fi
            
            echo "动态解析并锁定的 SukiSU 官方驱动版本 Code: $KSU_VERSION"
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            # 写入驱动 Kbuild 内部硬编码宏
            sed -i "s/DKSU_VERSION=[0-9]*/DKSU_VERSION=${KSU_VERSION}/g" kernel/Kbuild 2>/dev/null || true
            sed -i "s/KSU_VERSION_FALLBACK := [0-9]*/KSU_VERSION_FALLBACK := ${KSU_VERSION}/g" kernel/Kbuild 2>/dev/null || true
            cd ..
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            echo "正在配置 BakaSU (Baka-SU/BakaSU)..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            if [[ -n "$KSU_TARGET_REF" ]]; then
              echo ">>> 正在检出指定的 BakaSU 驱动版本/Commit: $KSU_TARGET_REF"
              git checkout "$KSU_TARGET_REF" || true
            fi
            KSU_VERSION=$(expr $(git rev-list --count HEAD 2>/dev/null || git rev-list --count main 2>/dev/null) + 30700 2>/dev/null || echo 114514)
            echo "计算得到的 BakaSU 驱动版本 Code: $KSU_VERSION"
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            cd ..
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在配置 KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            if [[ -n "$KSU_TARGET_REF" && "$KSU_TARGET_REF" != "dev-susfs" ]]; then
              echo ">>> 正在检出指定的 KernelSU Next 驱动版本/Commit: $KSU_TARGET_REF"
              git checkout "$KSU_TARGET_REF" || true
            fi
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            cd ../common/drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
            cd ../../../
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            if [[ -n "$KSU_TARGET_REF" ]]; then
              echo ">>> 正在检出指定的 KernelSU 驱动版本/Commit: $KSU_TARGET_REF"
              git checkout "$KSU_TARGET_REF" || true
            fi
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            echo "正在添加susfs补丁..."
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/69_hide_stuff.patch -O ./common/69_hide_stuff.patch
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cd ./common
            patch -p1 -F 3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在为原版 KernelSU (tiann/KernelSU)添加补丁..."
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cd ./KernelSU
            patch -p1 -F 3 < 10_enable_susfs_for_ksu.patch || true
            cd ..
          fi
          if [[ "${{ github.event.inputs.bypass_susfs_check }}" == "true" ]]; then
            echo ">>> 正在为 susfs_compat.mk 实施全量自动降级放行策略，规避版本阻断..."
            find . -type f -name "susfs_compat.mk" -exec sed -i 's/\$(error Please wait susfs update\.\. Stop\..*)/\$(warning Bypassing susfs check)/g' {} + || true
            find . -type f -name "susfs_compat.mk" -exec sed -i 's/\$(error Please wait susfs update\..*)/\$(warning Bypassing susfs check)/g' {} + || true
            find . -type f -name "susfs_compat.mk" -exec sed -i 's/\$(error .*)/\$(warning Bypassing check)/g' {} + || true
          fi

      - name: 应用 SELinux 耗时侧信道防御补丁 (PR #3877 开关控制)
        if: inputs.enable_timing_patch && inputs.ksu_type != 'none'
        run: |
          echo "正在应用内核系统调用耗时侧信道补丁 (抹平 newfstatat 与 statx 时间比值差异)..."
          cd kernel_workspace
          
          # 依次检测所有可能的驱动目录并应用优化
          for KSU_DIR in KernelSU KernelSU-Next common/drivers/kernelsu; do
            if [ -d "$KSU_DIR" ]; then
              echo ">>> 正在检查并处理驱动目录: $KSU_DIR"
              cd "$KSU_DIR"
              
              if [ -f "kernel/feature/selinux_hide.c" ]; then
                # 检查是否已原生合入修复 (避免重复修改)
                if grep -q "security_context_to_sid_with_policy.*orig_sid_p" kernel/feature/selinux_hide.c 2>/dev/null; then
                  echo ">>> 检测到 $KSU_DIR 源码已原生包含 PR #3877 耗时修复，无需额外注入！"
                else
                  echo ">>> 正在为 $KSU_DIR 注入耗时侧信道消除逻辑..."
                  # 核心动作：彻底拔除向全局 sidtab 二次同步带来的数百纳秒异常耗时（斩断时间侧信道探测源头）
                  sed -i '/\/\/ sync to global sidtab/,+1d' kernel/feature/selinux_hide.c || true
                  sed -i '/security_context_to_sid(buf, size, &tmp, GFP_KERNEL);/d' kernel/feature/selinux_hide.c || true
                  sed -i '/security_context_to_sid(scon, sconlen, &tmp, GFP_KERNEL);/d' kernel/feature/selinux_hide.c || true
                  sed -i '/security_context_to_sid(tcon, tconlen, &tmp, GFP_KERNEL);/d' kernel/feature/selinux_hide.c || true
                  sed -i '/security_context_to_sid(&selinux_state, scon, sconlen, &tmp, GFP_KERNEL);/d' kernel/feature/selinux_hide.c || true
                  sed -i '/security_context_to_sid(&selinux_state, tcon, tconlen, &tmp, GFP_KERNEL);/d' kernel/feature/selinux_hide.c || true
                  echo ">>> $KSU_DIR 中的 sidtab 冗余耗时已成功消除！"
                fi
              fi
              
              cd "${{ github.workspace }}/kernel_workspace"
            fi
          done

      - name: 应用 DirtyFrag (CVE-2026-43284) 官方安全修复 (Commit f4c50a4)
        if: inputs.dirtyfrag_fix
        run: |
          echo "正在应用 Linux 官方 DirtyFrag (CVE-2026-43284) 修复补丁 (Commit f4c50a4)..."
          cd kernel_workspace/common
          
          # 1. 修复 IPv4 UDP 发送路径：补齐 SKBFL_SHARED_FRAG 标记
          if [ -f "net/ipv4/ip_output.c" ]; then
            if grep -q "MSG_NO_SHARED_FRAGS" net/ipv4/ip_output.c; then
              echo ">>> net/ipv4/ip_output.c 已包含补丁，跳过。"
            else
              sed -i '/copy = err;/a \\t\t\tif (!(flags & MSG_NO_SHARED_FRAGS))\n\t\t\t\tskb_shinfo(skb)->flags |= SKBFL_SHARED_FRAG;' net/ipv4/ip_output.c || true
              echo ">>> net/ipv4/ip_output.c 补丁成功注入！"
            fi
          fi
          
          # 2. 修复 IPv6 UDP 发送路径：补齐 SKBFL_SHARED_FRAG 标记
          if [ -f "net/ipv6/ip6_output.c" ]; then
            if grep -q "MSG_NO_SHARED_FRAGS" net/ipv6/ip6_output.c; then
              echo ">>> net/ipv6/ip6_output.c 已包含补丁，跳过。"
            else
              sed -i '/copy = err;/a \\t\t\tif (!(flags & MSG_NO_SHARED_FRAGS))\n\t\t\t\tskb_shinfo(skb)->flags |= SKBFL_SHARED_FRAG;' net/ipv6/ip6_output.c || true
              echo ">>> net/ipv6/ip6_output.c 补丁成功注入！"
            fi
          fi
          
          # 3. 修复 ESP4 接收端：对共享分片强制回落到 skb_cow_data()，严禁就地解密覆写 Page Cache
          if [ -f "net/ipv4/esp4.c" ]; then
            sed -i 's/} else if (!skb_has_frag_list(skb)) {/} else if (!skb_has_frag_list(skb) \&\& !skb_has_shared_frag(skb)) {/g' net/ipv4/esp4.c || true
            echo ">>> net/ipv4/esp4.c 补丁成功注入！"
          fi
          
          # 4. 修复 ESP6 接收端：对共享分片强制回落到 skb_cow_data()，严禁就地解密覆写 Page Cache
          if [ -f "net/ipv6/esp6.c" ]; then
            sed -i 's/} else if (!skb_has_frag_list(skb)) {/} else if (!skb_has_frag_list(skb) \&\& !skb_has_shared_frag(skb)) {/g' net/ipv6/esp6.c || true
            echo ">>> net/ipv6/esp6.c 补丁成功注入！"
          fi
          
          echo "DirtyFrag 官方修复注入完成！"

      - name: 净化驱动 Git 工作区 (消除 -dirty 后缀)
        run: |
